# Publication awaits destination verification and installation/rollback checks.
name: release-validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.25-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git
      - name: Checkout Code
        uses: Actions-Mirrors/forgejo-actions-checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release archives
        uses: Actions-Mirrors/goreleaser-action@v6
        with:
          args: release --snapshot --clean
