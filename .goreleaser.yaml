# Release archives for terva-ext-web. Publication is disabled pending destination
# verification; see docs/plans/release-process.md.

version: 2

project_name: terva-ext-web

before:
  hooks:
    - sh scripts/package-manifest.sh {{ .Version }}

gitea_urls:
  api: https://git.local.sothr.com/api/v1
  download: https://git.local.sothr.com

builds:
  - id: terva-ext-web
    main: .
    binary: terva-ext-web
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Windows/arm64 is shipped by Go but rarely used — skip to keep the
    # release artifact list tidy.
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Stamp the tag version so `terva-ext-web --version` (and the protocol hello
      # + default User-Agent) report the release, not the committed default.
      - -X terva-ext-web/internal/version.Version={{.Version}}

archives:
  - id: terva-ext-web
    # Human-friendly name: terva-ext-web_0.4.0_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: .release-package/extension.json
        dst: .
        strip_parent: true
      - run.sh
      - LICENSE
      - skills/**
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  # Used by `goreleaser release --snapshot` (and the CI snapshot job);
  # lets contributors build a local release without pushing a tag.
  version_template: "0.4.0-next"

changelog:
  sort: asc
  # `git` reads the local log; the github/gitea modes query the host's
  # API, which the Forgejo release flow doesn't need.
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

release:
  disable: true
  gitea:
    owner: terva-sh
    name: terva-ext-web
  draft: true
  prerelease: auto
