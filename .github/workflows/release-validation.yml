name: Native release validation
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build candidate archives without publication
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
  native:
    if: github.server_url == 'https://github.com'
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: macos-15, goos: darwin, goarch: arm64 }
          - { os: windows-2025, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-archives
          path: candidate-archives
      - name: Verify native architecture and source behavior
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          python scripts/validate-archive.py --source "$EXPECTED_GOOS" "$EXPECTED_GOARCH"
      - name: Verify and exercise native archive
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: python scripts/validate-archive.py candidate-archives "$EXPECTED_GOOS" "$EXPECTED_GOARCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.goos }}-${{ matrix.goarch }}
          path: validation-report-*.json
          if-no-files-found: warn
